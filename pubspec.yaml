name: medical_clinic
description: "Desktop medical clinic management system UI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^13.2.0

  # State Management
  flutter_riverpod: ^2.5.1
  
  # Backend & Auth (Supabase)
  supabase_flutter: ^2.4.3
  flutter_dotenv: ^5.1.0
  
  # UI & Styling
  google_fonts: ^6.1.0
  lucide_icons_flutter: ^1.2.0
  intl: 0.20.2
  
  # Data Visualization & Calendar
  fl_chart: ^0.66.0
  table_calendar: ^3.1.0

  # Report Generation & Exports
  pdf: ^3.11.0
  printing: ^5.13.0
  file_saver: ^0.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
